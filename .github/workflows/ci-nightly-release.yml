name: Nightly Release Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-release-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-release:
    name: make check-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            binutils \
            grub-common \
            grub-pc-bin \
            xorriso \
            qemu-system-x86 \
            mtools

      - name: Run release smoke chain
        run: make check-release

      - name: Show reliability reports on failure
        if: failure()
        run: |
          for f in \
            build/qemu-smoke-reliability.report \
            build/qemu-smoke-reliability-replay.report \
            build/qemu-smoke-reliability-fuzz-lite.report; do
            if [ -f "$f" ]; then
              echo "== tail: $f =="
              tail -n 80 "$f"
            fi
          done
          for f in build/qemu-smoke-reliability*.log; do
            if [ -f "$f" ]; then
              echo "== tail: $f =="
              tail -n 120 "$f"
            fi
          done

      - name: Upload smoke logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/qemu-smoke*.log
            build/*.report
          if-no-files-found: warn
          retention-days: 30
